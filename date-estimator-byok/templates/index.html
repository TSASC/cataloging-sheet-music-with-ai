{% extends "base.html" %}

{% block title %}Search | Date Estimator BYOK{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Estimate Publication Dates</h1>
    <p class="page-subtitle">Enter publisher metadata from a music score to estimate when it was published, using IMSLP's publisher database.</p>
</div>

<form method="POST" action="/search">
    <div class="form-group">
        <label for="publisher">Publisher Name</label>
        <input id="publisher" name="publisher" required placeholder="e.g., Breitkopf & Härtel">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="city">City</label>
            <input id="city" name="city" placeholder="Optional">
        </div>
        <div class="form-group">
            <label for="plate">Plate Number</label>
            <input id="plate" name="plate" placeholder="Optional">
        </div>
    </div>

    <div class="form-group">
        <label for="address">Publisher Address</label>
        <input id="address" name="address" placeholder="Optional">
    </div>

    <button type="submit">Estimate Date</button>
</form>
{% endblock %}
